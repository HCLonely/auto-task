name: Release
'on':
  push:
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/Release.yml
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: false
          tag_name: v5.2.1
          name: 5.2.1
          body: "- 修复：Vk点赞任务获取参数失败\r\n- 修复：样式编译错误\r\n- 移除：Freeanywhere扩展任务支持"
          files: |-
            dist/auto-task.user.js
            dist/auto-task.min.user.js
            dist/auto-task.compatibility.user.js
            dist/auto-task.all.user.js
            dist/auto-task.min.all.user.js
            dist/auto-task.compatibility.all.user.js
          token: ${{ github.TOKEN }}
